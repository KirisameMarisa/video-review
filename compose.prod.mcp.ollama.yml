services:
  mcp:
    env_file:
      - .env

    image: videoreview-mcp:latest
    container_name: videoreview-mcp
    restart: unless-stopped

    environment:
      MCP_TRANSPORT: http
      MCP_PORT: "3490"
      NEXT_PUBLIC_VIDEO_REVIEW_USE_AI_SUPPORT: "true"
      VIDEO_REVIEW_SERVER_URL: http://videoreview:3489
      VIDEO_REVIEW_LLM_PROVIDER: ollama
      VIDEO_REVIEW_LLM_BASE_URL: http://ollama:11434
      # VIDEO_REVIEW_LLM_MODEL are loaded from .env

    ports:
      - "3490:3490"

    depends_on:
      - videoreview
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: videoreview-ollama
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ${DOCKER_HOST_LLM_MODELS:-videoreview-llm-models}:/root/.ollama/models

volumes:
  videoreview-llm-models:
