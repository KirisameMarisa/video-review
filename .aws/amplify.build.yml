version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - echo "JWT_SECRET=$JWT_SECRET" >> .env
        - echo "S3_BUCKET=$S3_BUCKET" >> .env
        - echo "S3_REGION=$S3_REGION" >> .env
        - echo "VIDEO_REVIEW_STORAGE=$VIDEO_REVIEW_STORAGE" >> .env
        - echo "VIDEO_REVIEW_API_TOKEN=$VIDEO_REVIEW_API_TOKEN" >> .env
        - echo "DATABASE_URL=$DATABASE_URL" >> .env
        # next build otherwise OOMs at Node's default ~2GB heap on the 8GiB builder
        - NODE_OPTIONS=--max-old-space-size=4096 npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
